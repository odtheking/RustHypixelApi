[workspace]
members = [
    "ltmdb",
    "single_flight",
    "rapidhash_lite",
    "cusp",
    "simple_defer",
]

[package]
name = "hypixel_api"
version = "1.4.1" # includes db/singleflight updates.
edition = "2024"

[dependencies]
actix-web = { version = "4.14.0" }
reqwest = { version = "0.13.4", features = ["json"] }
serde_json = "1.0.150"
governor = "0.10.4"
flate2 = "1.1.9"
uuid = { version = "1.23.4", features = ["v4", "serde"] }
futures = "0.3.32"
simd-json = "0.17.0"
mimalloc = "0.1.52"
serde = "1.0.228"
tokio =  { version = "1.52.3", features = ["macros", "sync", "rt-multi-thread"] }
ltmdb = { path = "ltmdb" }
single_flight = { path = "single_flight" }
portable-atomic = "1.13.1"
rapidhash_lite = { path = "rapidhash_lite" }
simple_defer = { path = "simple_defer" }
TinyUFO = "0.8.1" # force_put is not exposed by pingora-memory-cache

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
debug = true
